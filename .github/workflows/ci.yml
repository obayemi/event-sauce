name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          cargo llvm-cov --workspace --all-features --all-targets \
            --lcov --output-path coverage.lcov

      - name: Enforce coverage threshold
        run: |
          cargo llvm-cov report --summary-only --json --output-path coverage.json
          coverage=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          echo "Line coverage: ${coverage}%"
          if awk "BEGIN { exit !($coverage < $COVERAGE_MIN) }"; then
            echo "::error::Coverage is ${coverage}%, below the ${COVERAGE_MIN}% threshold"
            echo "Run 'cargo llvm-cov --workspace --all-features --all-targets --html' for details"
            exit 1
          fi
          echo "Coverage is ${coverage}% (threshold ${COVERAGE_MIN}%)"
        env:
          COVERAGE_MIN: '90'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  doc-tests:
    name: Doc Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run doc tests
        run: cargo test --workspace --all-features --doc

  build-targets:
    name: Examples & Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build examples
        run: cargo build --workspace --all-features --examples

      - name: Build benchmarks
        run: cargo build --workspace --all-features --benches

  clippy:
    name: Clippy (Linting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  fmt:
    name: Rustfmt (Formatting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Run security audit
        run: cargo audit

  msrv:
    name: Check MSRV (1.98)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check compilation with MSRV
        run: cargo check --workspace --all-features --all-targets

  feature-matrix:
    name: Core Feature Combinations
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        features:
          - ''
          - event-sourcing
          - state-store
          - event-sourcing,state-store

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check event-sauce-core with features "${{ matrix.features }}"
        run: |
          cargo check -p event-sauce-core --no-default-features \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

  feature-matrix-memory-facade:
    name: Memory/Facade Feature Combinations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clippy event-sauce-memory with no persistence style
        run: cargo clippy -p event-sauce-memory --no-default-features --lib -- -D warnings

      - name: Clippy event-sauce-memory with event-sourcing
        run: cargo clippy -p event-sauce-memory --no-default-features --features event-sourcing --lib -- -D warnings

      - name: Clippy event-sauce-memory with state-store
        run: cargo clippy -p event-sauce-memory --no-default-features --features state-store --lib -- -D warnings

      - name: Clippy event-sauce-memory with crypto
        run: cargo clippy -p event-sauce-memory --no-default-features --features crypto --lib -- -D warnings

      - name: Clippy event-sauce facade with memory alone
        run: cargo clippy -p event-sauce --no-default-features --features memory --lib -- -D warnings

      - name: Clippy event-sauce facade with memory and event-sourcing
        run: cargo clippy -p event-sauce --no-default-features --features memory,event-sourcing --lib -- -D warnings

      - name: Clippy event-sauce facade with memory and state-store
        run: cargo clippy -p event-sauce --no-default-features --features memory,state-store --lib -- -D warnings

      - name: Clippy event-sauce facade with postgres
        run: cargo clippy -p event-sauce --no-default-features --features postgres --lib -- -D warnings
