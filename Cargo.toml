[workspace]
members = [
    "crates/event-sauce",
    "crates/event-sauce-core",
    "crates/event-sauce-crypto",
    "crates/event-sauce-macros",
    "crates/event-sauce-postgres",
    "crates/event-sauce-memory",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/obayemi/event-sauce"
authors = ["obayemi <martial.elegbede@sensinov.com>"]

[workspace.dependencies]
# Async runtime (latest stable: 1.48.0)
tokio = { version = "1.48", features = ["full"] }
tokio-test = "0.4"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1.88"
async-stream = "0.3"

# Serialization (latest stable)
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Database (latest stable: 0.8.6)
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Error handling (latest stable)
thiserror = "2.0.16"
anyhow = "1.0.99"

# Utilities (latest stable)
uuid = { version = "1.18.1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
tracing = "0.1.41"

# Testing (latest stable)
proptest = "1.9.0"
proptest-derive = "0.5"
serial_test = "3.2"

# Macros (latest stable: syn 2.0.104)
syn = { version = "2.0.104", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0.103"
darling = "0.20"
proc-macro-crate = "3"
paste = "1.0"

# Encoding
base64 = "0.22"

# Cryptography
aes-gcm = "0.10"
zeroize = "1"
sha2 = "0.10"

# Additional utilities
parking_lot = "0.12"
once_cell = "1.20"

# Development dependencies
criterion = "0.5"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
