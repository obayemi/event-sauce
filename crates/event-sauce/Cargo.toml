[package]
name = "event-sauce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Event-driven modeling and event sourcing for Rust"
keywords = ["event-sourcing", "cqrs", "ddd", "async", "streaming"]
categories = ["asynchronous", "database"]
readme = "../../README.md"

[dependencies]
event-sauce-core = { path = "../event-sauce-core", version = "0.1.0", default-features = false }
event-sauce-memory = { path = "../event-sauce-memory", version = "0.1.0", default-features = false, optional = true }
event-sauce-postgres = { path = "../event-sauce-postgres", version = "0.1.0", default-features = false, optional = true }
event-sauce-macros = { path = "../event-sauce-macros", version = "0.1.0", optional = true }
event-sauce-crypto = { path = "../event-sauce-crypto", version = "0.1.0", optional = true }

[features]
default = ["macros", "memory", "event-sourcing", "state-store"]
macros = ["dep:event-sauce-macros"]
memory = ["dep:event-sauce-memory"]
postgres = ["dep:event-sauce-postgres", "event-sourcing", "state-store"]
crypto = [
    "dep:event-sauce-crypto",
    "event-sourcing",
    "event-sauce-memory?/crypto",
    "event-sauce-postgres?/crypto",
]
event-sourcing = [
    "event-sauce-core/event-sourcing",
    "event-sauce-memory?/event-sourcing",
]
state-store = [
    "event-sauce-core/state-store",
    "event-sauce-memory?/state-store",
]
# The read graph between published payloads and the aggregates they read.
# `event_sauce::dependencies`, and its items at the root, come through the core
# re-export; the flag is all the facade adds.
dependencies = ["event-sauce-core/dependencies"]
full = [
    "macros",
    "memory",
    "postgres",
    "crypto",
    "event-sourcing",
    "state-store",
    "dependencies",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
async-trait.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
sqlx = { workspace = true, features = ["postgres"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
paste.workspace = true

[[example]]
name = "postgres-quickstart"
required-features = ["postgres"]

[[example]]
name = "projection-worker"
required-features = ["postgres"]

[[example]]
name = "crypto-shredding"

[[example]]
name = "state-stored-order"
required-features = ["memory", "state-store", "event-sourcing"]

[[bench]]
name = "event_application"
harness = false
