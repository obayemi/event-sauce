[package]
name = "event-sauce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Production-ready event sourcing for Rust"
keywords = ["event-sourcing", "cqrs", "ddd", "async", "streaming"]
categories = ["asynchronous", "database"]
readme = "../../README.md"

[dependencies]
event-sauce-core = { path = "../event-sauce-core", version = "0.1.0" }
event-sauce-memory = { path = "../event-sauce-memory", version = "0.1.0", optional = true }
event-sauce-postgres = { path = "../event-sauce-postgres", version = "0.1.0", optional = true }
event-sauce-sqlite = { path = "../event-sauce-sqlite", version = "0.1.0", optional = true }
event-sauce-projections = { path = "../event-sauce-projections", version = "0.1.0", optional = true }
# event-sauce-sagas = { path = "../event-sauce-sagas", version = "0.1.0", optional = true }  # TODO: Refactor to use Subscription
event-sauce-macros = { path = "../event-sauce-macros", version = "0.1.0", optional = true }

[features]
default = ["macros", "memory"]
macros = ["dep:event-sauce-macros"]
memory = ["dep:event-sauce-memory"]
postgres = ["dep:event-sauce-postgres"]
sqlite = ["dep:event-sauce-sqlite"]
projections = ["dep:event-sauce-projections"]
# sagas = ["dep:event-sauce-sagas"]  # TODO: Refactor to use Subscription
full = ["macros", "memory", "postgres", "sqlite", "projections"]  # Removed sagas

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
async-trait.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
sqlx = { workspace = true, features = ["postgres"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# TODO: Re-enable after refactoring sagas to use Subscription system
# [[example]]
# name = "saga-payment"
# required-features = ["memory", "sagas"]

# [[example]]
# name = "process-manager-order"
# required-features = ["memory", "sagas"]

# TODO: Refactor to use Subscription system instead of EventBus
# [[example]]
# name = "task-projections"
# required-features = ["memory", "projections"]

[[example]]
name = "bank-account"
required-features = ["macros", "memory"]

[[example]]
name = "counter"
required-features = ["macros", "memory"]

[[example]]
name = "snapshotting"
required-features = ["macros", "memory"]

[[example]]
name = "shopping-cart"
required-features = ["macros", "memory"]

[[example]]
name = "snapshotting-postgres"
required-features = ["macros", "postgres"]

[[bench]]
name = "event_application"
harness = false
