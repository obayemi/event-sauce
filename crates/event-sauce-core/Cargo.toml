[package]
name = "event-sauce-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core traits and types for the event-sauce event-driven framework"
keywords = ["event-sourcing", "cqrs", "ddd", "aggregate", "events"]
categories = ["asynchronous", "database"]

[features]
default = ["event-sourcing", "state-store"]
event-sourcing = ["dep:base64", "dep:futures", "dep:tokio", "dep:tracing", "dep:zeroize"]
state-store = []

[dependencies]
async-trait.workspace = true
futures = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"], optional = true }
tracing = { workspace = true, optional = true }
paste.workspace = true
base64 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt", "rt-multi-thread"] }
tokio-test.workspace = true
proptest.workspace = true
anyhow.workspace = true
