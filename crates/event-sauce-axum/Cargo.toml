[package]
name = "event-sauce-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "axum and tower integration for event-sauce"
keywords = ["event-sourcing", "axum", "tower", "correlation", "http"]
categories = ["web-programming", "asynchronous"]

[features]
default = ["tracing", "login"]
login = ["dep:axum-login", "dep:event-sauce-auth", "dep:thiserror"]
tracing = ["dep:tracing"]

[dependencies]
axum.workspace = true
axum-login = { workspace = true, optional = true }
event-sauce-auth = { path = "../event-sauce-auth", version = "0.1.0", default-features = false, optional = true }
event-sauce-core = { path = "../event-sauce-core", version = "0.1.0", default-features = false, features = ["event-sourcing", "unit-of-work"] }
http.workspace = true
serde.workspace = true
thiserror = { workspace = true, optional = true }
tower = { workspace = true }
tracing = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
argon2.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["macros", "json"] }
chrono.workspace = true
event-sauce-auth = { path = "../event-sauce-auth", version = "0.1.0", features = ["argon2", "moka"] }
event-sauce-memory = { path = "../event-sauce-memory", version = "0.1.0", features = ["unit-of-work"] }
futures.workspace = true
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
tower-sessions = { workspace = true, features = ["memory-store"] }

[[test]]
name = "login"
required-features = ["login"]
