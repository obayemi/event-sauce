[package]
name = "event-sauce-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "axum and tower integration for event-sauce"
keywords = ["event-sourcing", "axum", "tower", "correlation", "http"]
categories = ["web-programming", "asynchronous"]

[features]
default = ["tracing"]
tracing = ["dep:tracing"]

[dependencies]
axum.workspace = true
event-sauce-core = { path = "../event-sauce-core", version = "0.1.0", default-features = false, features = ["event-sourcing", "unit-of-work"] }
http.workspace = true
serde.workspace = true
tower = { workspace = true }
tracing = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
axum = { workspace = true, features = ["macros"] }
chrono.workspace = true
event-sauce-memory = { path = "../event-sauce-memory", version = "0.1.0", features = ["unit-of-work"] }
futures.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tower = { workspace = true, features = ["util"] }
