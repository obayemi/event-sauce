[package]
name = "event-sauce-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "axum and tower integration for event-sauce"
keywords = ["event-sourcing", "axum", "tower", "correlation", "http"]
categories = ["web-programming", "asynchronous"]

[features]
default = ["tracing", "login", "app"]
app = [
    "login",
    "dep:event-sauce-postgres",
    "dep:sqlx",
    "event-sauce-auth/postgres",
    "event-sauce-auth/moka",
]
login = ["dep:async-trait", "dep:axum-login", "dep:event-sauce-auth", "dep:thiserror"]
tracing = ["dep:tracing"]

[dependencies]
async-trait = { workspace = true, optional = true }
axum.workspace = true
axum-login = { workspace = true, optional = true }
event-sauce-auth = { path = "../event-sauce-auth", version = "0.1.0", default-features = false, optional = true }
event-sauce-core = { path = "../event-sauce-core", version = "0.1.0", default-features = false, features = ["event-sourcing", "unit-of-work"] }
event-sauce-postgres = { path = "../event-sauce-postgres", version = "0.1.0", features = ["unit-of-work"], optional = true }
http.workspace = true
serde.workspace = true
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tower = { workspace = true }
tracing = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
argon2.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["macros", "json"] }
chrono.workspace = true
event-sauce-auth = { path = "../event-sauce-auth", version = "0.1.0", features = ["argon2", "moka"] }
event-sauce-memory = { path = "../event-sauce-memory", version = "0.1.0", features = ["unit-of-work"] }
event-sauce-postgres = { path = "../event-sauce-postgres", version = "0.1.0", features = ["unit-of-work"] }
futures.workspace = true
secrecy.workspace = true
serde_json.workspace = true
sqlx.workspace = true
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tower = { workspace = true, features = ["util"] }
tower-sessions = { workspace = true, features = ["memory-store"] }
trybuild.workspace = true

[[test]]
name = "login"
required-features = ["login"]

[[test]]
name = "compile_fail"
required-features = ["app"]

[[test]]
name = "app"
required-features = ["app"]
