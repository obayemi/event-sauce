[package]
name = "event-sauce-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PostgreSQL backend for event-sauce event sourcing library"
keywords = ["event-sourcing", "postgresql", "database"]
categories = ["asynchronous", "database"]

[features]
default = ["crypto"]
crypto = ["dep:event-sauce-crypto"]

[dependencies]
event-sauce-core = { path = "../event-sauce-core", version = "0.1.0" }
event-sauce-crypto = { path = "../event-sauce-crypto", version = "0.1.0", optional = true }
sqlx = { workspace = true, features = ["postgres"] }
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
sha2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt", "rt-multi-thread"] }
serial_test.workspace = true
anyhow.workspace = true
paste.workspace = true
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
