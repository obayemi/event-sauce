[package]
name = "event-sauce-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pluggable credentials, login methods and authentication for event-sauce user aggregates"
keywords = ["event-sourcing", "authentication", "login", "identity"]
categories = ["authentication"]

[features]
default = ["argon2", "postgres"]
argon2 = ["dep:argon2"]
moka = ["dep:moka"]
postgres = ["dep:sqlx"]
reset = ["dep:base64", "dep:rand", "dep:subtle"]
redis = ["dep:redis", "dep:zeroize"]
totp = ["dep:totp-rs"]

[dependencies]
event-sauce-core = { path = "../event-sauce-core", version = "0.1.0" }
argon2 = { workspace = true, optional = true }
async-trait.workspace = true
base64 = { workspace = true, optional = true }
chrono.workspace = true
email_address.workspace = true
moka = { workspace = true, optional = true }
phc.workspace = true
rand = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true, features = ["postgres"] }
subtle = { workspace = true, optional = true }
thiserror.workspace = true
totp-rs = { workspace = true, optional = true }
tracing.workspace = true
uuid.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
event-sauce-memory = { path = "../event-sauce-memory", version = "0.1.0", features = ["crypto"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres", "redis"] }
tokio-test.workspace = true

[[test]]
name = "claim_authenticator"
required-features = ["argon2"]

[[test]]
name = "postgres_login_store"
required-features = ["postgres"]

[[test]]
name = "redis_login_store"
required-features = ["redis"]

[[test]]
name = "second_factor"
required-features = ["argon2", "totp"]

[[test]]
name = "user_cache"
required-features = ["moka"]

[[test]]
name = "redis_user_cache"
required-features = ["redis"]
